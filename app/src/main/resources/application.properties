server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# Strict Content Security Policy: Flow sends the header with a nonce and
# refuses JavaScript sent as strings. Try -Dvaadin.contentSecurityPolicy=warn to list the
# add-on calls with their Java callers instead.
vaadin.contentSecurityPolicy=strict
