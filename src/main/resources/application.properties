server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# warn: log every string JavaScript call site (once each) with a stack trace.
# strict: such a call site throws a CspViolationException, and in production
# mode Vaadin also sends a Content-Security-Policy header.
# Change it on the command line with -Dvaadin.csp=strict.
vaadin.csp=warn

vaadin.launch-browser=false
