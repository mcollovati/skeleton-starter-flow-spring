server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# strict: a string JavaScript call site throws a CspViolationException, and in
# production mode Vaadin also sends a Content-Security-Policy header.
# warn: log every string JavaScript call site (once each) with a stack trace.
# Change it on the command line with -Dvaadin.csp=warn.
vaadin.csp=strict

vaadin.launch-browser=false
